name: Update and Deploy

on:
  schedule:
    - cron: '0 9 * * *' # Runs daily at 9am UTC
  workflow_dispatch:      # Allows you to click "Run" manually

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job that does EVERYTHING sequentially
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Get your code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup R environment
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 3. Install Packages
      - name: Install R Packages
        run: |
          install.packages("pacman")
        shell: Rscript {0}

      # 4. Generate the JSON file
      - name: Run Analysis Script
        run: Rscript scripts/update_data.R

      # 5. Save (Commit) the JSON file to your Repo
      # This step ensures data.json appears in your file list!
      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Update stats data" || echo "No changes to commit"
          git push

      # 6. Package the website (HTML + JS + CSS + NEW data.json)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 7. Publish to the internet
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4