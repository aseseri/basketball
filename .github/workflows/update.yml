name: Daily Update

on:
  schedule:
    - cron: '0 9 * * *' # Daily at 9am UTC
  workflow_dispatch:      # Manual trigger button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout Code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # 3. Install Linux System Dependencies (Fixes 'curl' error)
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev

      # 4. Install R Packages
      - name: Install R Packages
        run: |
          install.packages(c("pacman", "curl", "httr", "wehoop", "dplyr", "jsonlite", "lubridate", "janitor"))
        shell: Rscript {0}

      # 5. Generate JSON
      - name: Run Analysis Script
        run: Rscript scripts/update_data.R

      # 6. Commit and Push JSON
      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git commit -m "Auto-update stats" || echo "No changes to commit"
          git push

      # 7. Upload Website Artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 8. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4